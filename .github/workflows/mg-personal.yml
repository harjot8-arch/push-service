# MG stealth: personal single-device build. arm64-v8a release APK only, built on
# manual dispatch, uploaded as an artifact to download and sideload. Reuses the
# repo's own build-mg composite action so the native build matches upstream CI.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   APP_ID, APP_HASH                         - Telegram api keys (my.telegram.org)
#   RELEASE_KEYSTORE                         - base64 of your keystore .jks
#   RELEASE_KEYSTORE_PASSWORD                - keystore password
#   RELEASE_KEY_ALIAS                        - key alias
#   RELEASE_KEY_PASSWORD                     - key password
#
# Use ONE stable keystore forever so updates install over the existing app.
name: MG personal (arm64)

on:
  workflow_dispatch:
    inputs:
      build_tag:
        description: 'Version baked into the APK (4-dotted X.Y.Z.M, e.g. 13.0.3.1)'
        required: true
        default: '13.0.3.1'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Free disk space
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/share/swift \
                      /usr/local/lib/node_modules /usr/local/share/powershell \
                      /usr/local/share/chromium /opt/microsoft || true
          sudo docker image prune --all --force || true
          echo "After:"; df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Cache the expensive native build outputs. First run misses and compiles
      # (~30 min); it saves at job end even if a later step fails, so any retry
      # restores the compiled libraries and skips most of the native compile.
      # Key folds in submodule pins + gradle (NDK) — stable across our Java/manifest
      # edits, so iteration hits the cache. restore-keys gives a partial-match fallback.
      - name: Cache native build outputs (arm64)
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/jni/prebuild/lib/arm64-v8a
            TMessagesProj/jni/prebuild/include/arm64-v8a
            TMessagesProj/jni/prebuild/include/wallet-engine
            TMessagesProj/jni/td/td/generate/auto
            TMessagesProj/jni/td/tdutils/generate/auto
            TMessagesProj/.cxx
          key: jni-arm64-${{ hashFiles('.gitmodules', 'TMessagesProj/build.gradle') }}
          restore-keys: |
            jni-arm64-

      - name: Build arm64 release APK
        id: build
        uses: ./.github/actions/build-mg
        with:
          flavor: afatFdArm64
          task: assembleAfatFdArm64Release
          abi: arm64-v8a
          build-type: release
          artifact-version: ${{ github.event.inputs.build_tag }}
          build-tag: ${{ github.event.inputs.build_tag }}
          app-id: ${{ secrets.APP_ID }}
          app-hash: ${{ secrets.APP_HASH }}
          release-keystore-b64: ${{ secrets.RELEASE_KEYSTORE }}
          release-keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          release-key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          release-key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mercurygram-arm64-${{ github.event.inputs.build_tag }}
          path: ${{ steps.build.outputs.apk_path }}
          if-no-files-found: error

